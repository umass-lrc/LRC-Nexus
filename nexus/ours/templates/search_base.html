<!--Extends base template-->
{% extends "base.html" %}
<!--So forms look good-->
{% load crispy_forms_tags %} {% load static %} {% block extra_head %}
<link rel="stylesheet" href="{% static 'css/search.css' %}" />
{% endblock %}

<!--Content of the page-->
{% block content %}
<h1 class="text-center">Search for Opportunities</h1>
<div
  class="row height d-flex justify-content-center align-items-center"
  style="z-index: 10000"
>
  <div class="col-md-10">
    <form
      class="search"
      hx-post="{% url 'opportunity_search' %}"
      hx-swap="multi:#result_stats:outerHTML,#results:innerHTML"
      hx-trigger="click from:#submit-id-submit, change from:.search-filters"
      placeholder="Searching..."
    >
      <div class="search-bar">
        <i class="fa fa-search search-icon"></i>
        <input
          type="text"
          name="search_query"
          class="form-control"
          placeholder="Want to find some job/research opportunities? Search here!"
        />
        <input
          type="submit"
          name="submit"
          value="Search"
          class="btn btn-primary btn btn-primary text-center"
          id="submit-id-submit"
        />
      </div>

      <div class="search-filters">
        <div class="filter-group">
          <input type="checkbox" class="btn-check" name="on_campus" id="on_campus_true" value="true">
          <label class="btn" for="on_campus_true">On-campus</label>
        </div>
        <div class="filter-group">
          <input type="checkbox" class="btn-check" name="is_paid" id="is_paid_true" value="true">
          <label class="btn" for="is_paid_true">Paid</label>
        </div>
      </div>
    </form>
  </div>
</div>
<hr />
<p id="result_stats">
  Showing results for: "<b></b>", Found <b>0</b> opportunities.
</p>
<div id="results">
  <div
    hx-get="{% url 'search_no_result'%}"
    hx-trigger="load"
    hx-swap="multi:#result_stats:outerHTML,#results:innerHTML"
  ></div>
</div>
{% endblock %} {% block extra_scripts %}
<script>
  // get both pupils
  let pupils = [];
  document.body.addEventListener("noResult", function (e) {
    pupils = document.querySelectorAll(".eye .pupil");
  });
  window.addEventListener("mousemove", (e) => {
    pupils.forEach((pupil) => {
      // get x and y postion of cursor
      var rect = pupil.getBoundingClientRect();
      var x = (e.pageX - rect.left) / 30 + "px";
      var y = (e.pageY - rect.top) / 30 + "px";
      pupil.style.transform = "translate3d(" + x + "," + y + ", 0px)";
    });
  });

  function search_keyword(keyword) {
    document.querySelector("input[name='search_query']").value = keyword;
    document.querySelector("input[name='submit']").click();
  }
</script>
{% endblock %}
