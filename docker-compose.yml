services:
  elasticsearch:
    container_name: es-nexus
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    env_file:
      - ./.env.dev
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - node.name=es-nexus
      - cluster.name=es-docker-cluster
      - network.host=0.0.0.0
    expose:
      - "9200"
    networks:
      - nexus-network
    mem_limit: 4gb
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  db:
    container_name: db-nexus
    image: postgres:17
    environment:
      - POSTGRES_DB=nexus
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexus
    ports:
      # set DB_HOST_PORT if 5432 is already taken on the host
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - nexus-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    container_name: django-nexus
    build: ./nexus
    volumes:
      - ./nexus:/usr/src/app/
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev
    depends_on:
      elasticsearch:
        condition: service_started
      # migrations run in the entrypoint, so wait until Postgres accepts connections
      db:
        condition: service_healthy
    networks:
      - nexus-network

volumes:
  elasticsearch_data:
    driver: local
  postgres_data:
    driver: local

networks:
  nexus-network:
    driver: bridge